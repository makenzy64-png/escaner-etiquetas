<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escáner de Etiquetas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #EAF3DE; --green-text: #3B6D11;
    --amber-light: #FAEEDA; --amber-text: #854F0B;
    --red-light: #FCEBEB; --red-text: #A32D2D;
    --bg: #f5f5f0; --card: #ffffff; --border: rgba(0,0,0,0.12);
    --text: #1a1a18; --text2: #666660; --mono: 'Courier New', monospace;
  }
  html, body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }

  header { background: var(--green); color: #fff; padding: 14px 16px 12px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
  header h1 { font-size: 17px; font-weight: 600; }
  header p { font-size: 11px; opacity: 0.8; }

  main { padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin: 0 auto; }

  .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); margin-bottom: 10px; }

  #cam-wrap { position: relative; border-radius: 10px; overflow: hidden; background: #111; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
  #video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #canvas-hidden { display: none; }
  .cam-idle { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #666; }
  .cam-idle svg { opacity: 0.35; }
  .cam-idle span { font-size: 13px; }
  .finder { position: absolute; inset: 15% 8%; border: 2px solid rgba(29,158,117,0.75); border-radius: 8px; display: none; }
  .corner { position: absolute; width: 18px; height: 18px; }
  .corner-tl { top:-2px; left:-2px; border-top:3px solid #1D9E75; border-left:3px solid #1D9E75; border-radius:3px 0 0 0; }
  .corner-tr { top:-2px; right:-2px; border-top:3px solid #1D9E75; border-right:3px solid #1D9E75; border-radius:0 3px 0 0; }
  .corner-bl { bottom:-2px; left:-2px; border-bottom:3px solid #1D9E75; border-left:3px solid #1D9E75; border-radius:0 0 0 3px; }
  .corner-br { bottom:-2px; right:-2px; border-bottom:3px solid #1D9E75; border-right:3px solid #1D9E75; border-radius:0 0 3px 0; }
  .scan-line { position: absolute; left:8%; right:8%; height:2px; background: linear-gradient(90deg,transparent,#1D9E75,transparent); display:none; animation: scanmove 2s ease-in-out infinite; }
  @keyframes scanmove { 0%,100%{top:17%} 50%{top:81%} }

  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; padding:11px 8px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; border:1.5px solid var(--border); background:#f0f0ea; color:var(--text); -webkit-tap-highlight-color:transparent; }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.primary:active { background:var(--green-dark); }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .btn.danger { background:var(--red-light); color:var(--red-text); border-color:transparent; }

  .status { font-size:12px; padding:7px 10px; border-radius:8px; margin-top:8px; display:none; font-weight:500; line-height:1.4; }
  .status.scan { background:var(--amber-light); color:var(--amber-text); }
  .status.ok   { background:var(--green-light);  color:var(--green-text); }
  .status.err  { background:var(--red-light);    color:var(--red-text); }

  .progress-wrap { height:3px; background:#e0e0d8; border-radius:2px; margin-top:8px; display:none; overflow:hidden; }
  .progress-bar  { height:100%; background:var(--green); width:0%; transition:width 0.3s; }

  .res-grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-bottom:10px; }
  .res-lbl  { font-size:10px; color:var(--text2); margin-bottom:4px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .res-val  { font-family:var(--mono); font-size:14px; font-weight:700; background:#f5f5f0; padding:8px 10px; border-radius:8px; border:1px solid var(--border); min-height:40px; display:flex; align-items:center; color:var(--green-dark); word-break:break-all; }
  .res-val.empty { font-size:11px; color:#aaa; font-family:inherit; font-weight:400; }
  .ocr-box  { font-family:var(--mono); font-size:11px; background:#f5f5f0; padding:7px 10px; border-radius:8px; color:var(--text2); word-break:break-all; min-height:32px; line-height:1.5; border:1px solid var(--border); }

  .manual-grid { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:6px; margin-top:10px; }
  .manual-grid input { padding:9px 8px; border-radius:9px; border:1.5px solid var(--border); background:#fafaf8; font-size:13px; font-family:var(--mono); color:var(--text); -webkit-appearance:none; width:100%; }
  .manual-grid input:focus { outline:none; border-color:var(--green); }
  .save-btn { padding:9px 14px; border-radius:9px; background:var(--green); color:#fff; font-size:14px; font-weight:700; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .save-btn:active { background:var(--green-dark); transform:scale(0.97); }

  .table-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .table-header .card-label { margin:0; }
  .tbl-actions { display:flex; gap:6px; }
  .tbl-btn { padding:5px 11px; border-radius:8px; font-size:12px; font-weight:600; border:1.5px solid var(--border); background:#f0f0ea; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tbl-btn.export { background:var(--green); color:#fff; border-color:var(--green); }
  .tbl-wrap { overflow-x:auto; border-radius:8px; border:1px solid var(--border); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#f5f5f0; padding:7px 8px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text2); border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:7px 8px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:12px; }
  tr:last-child td { border-bottom:none; }
  tr.new-row td { background:#EAF3DE; animation:faderow 2s forwards; }
  @keyframes faderow { to { background:transparent; } }
  .empty-msg { text-align:center; padding:20px; color:var(--text2); font-size:13px; font-family:inherit; }
  footer { text-align:center; padding:16px 12px 28px; font-size:11px; color:#bbb; }
</style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2z"/><path d="M18 14h3v3h-3z"/><path d="M14 18h2v3h-2z"/></svg>
  <div><h1>Escáner de Etiquetas</h1><p>Código · Pallet · Bultos</p></div>
</header>

<main>
  <div class="card">
    <div class="card-label">Cámara</div>
    <div id="cam-wrap">
      <div class="cam-idle" id="cam-idle">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Tocá "Activar cámara"</span>
      </div>
      <video id="video" autoplay playsinline muted></video>
      <div class="finder" id="finder">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
      </div>
      <div class="scan-line" id="scan-line"></div>
    </div>
    <canvas id="canvas-hidden"></canvas>
    <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="btn-row">
      <button class="btn" id="btn-cam">Activar cámara</button>
      <button class="btn primary" id="btn-scan" disabled>📷 Escanear</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="card-label">Resultado</div>
    <div class="res-grid">
      <div><div class="res-lbl">Código</div><div class="res-val empty" id="res-code">–</div></div>
      <div><div class="res-lbl">Pallet</div><div class="res-val empty" id="res-pallet">–</div></div>
      <div><div class="res-lbl">Bultos</div><div class="res-val empty" id="res-bultos">–</div></div>
    </div>
    <div class="res-lbl" style="margin-bottom:5px">Texto OCR crudo</div>
    <div class="ocr-box" id="ocr-raw">Escaneá una etiqueta…</div>
    <div class="manual-grid">
      <input type="text" id="inp-code" placeholder="3111-70-JR-0500" style="font-size:11px">
      <input type="text" id="inp-pallet" placeholder="Pallet" inputmode="numeric">
      <input type="text" id="inp-bultos" placeholder="Bultos" inputmode="numeric">
      <button class="save-btn" id="btn-save">OK</button>
    </div>
  </div>

  <div class="card">
    <div class="table-header">
      <div class="card-label">Registros <span id="count" style="font-weight:400;color:var(--text2)">(0)</span></div>
      <div class="tbl-actions">
        <button class="tbl-btn" id="btn-clear">Limpiar</button>
        <button class="tbl-btn export" id="btn-export">⬇ Excel</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>Código</th><th>Pallet</th><th>Bultos</th><th>Fecha/Hora</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" class="empty-msg">Sin registros aún</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<footer>Los datos se guardan aunque cierres el navegador</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const records = JSON.parse(localStorage.getItem('etiquetas_v2') || '[]');
let stream=null, worker=null, isScanning=false;

const $=id=>document.getElementById(id);
const video=$('video'), cvs=$('canvas-hidden'), ctx=cvs.getContext('2d');
const btnCam=$('btn-cam'), btnScan=$('btn-scan'), btnSave=$('btn-save');
const btnClear=$('btn-clear'), btnExport=$('btn-export');
const resCode=$('res-code'), resPallet=$('res-pallet'), resBultos=$('res-bultos');
const ocrRaw=$('ocr-raw'), statusEl=$('status');
const inpCode=$('inp-code'), inpPallet=$('inp-pallet'), inpBultos=$('inp-bultos');
const tbody=$('tbody'), count=$('count');
const finder=$('finder'), scanLine=$('scan-line'), camIdle=$('cam-idle');
const progressWrap=$('progress-wrap'), progressBar=$('progress-bar');

function setStatus(msg,type){ statusEl.textContent=msg; statusEl.className='status '+type; statusEl.style.display='block'; }
function setProgress(p){ progressWrap.style.display=p>0?'block':'none'; progressBar.style.width=p+'%'; }

async function initWorker(){
  if(worker)return;
  setStatus('Cargando motor OCR… (solo la primera vez)','scan'); setProgress(10);
  worker=await Tesseract.createWorker('eng',1,{logger:m=>{
    if(m.status==='loading tesseract core')setProgress(20);
    if(m.status==='initializing tesseract')setProgress(45);
    if(m.status==='loading language traineddata')setProgress(65);
    if(m.status==='initializing api')setProgress(82);
    if(m.status==='recognizing text'){setStatus('Reconociendo… '+Math.round(m.progress*100)+'%','scan');setProgress(82+m.progress*16);}
  }});
  await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789- :/'});
  setProgress(100); setTimeout(()=>{setProgress(0);statusEl.style.display='none';},700);
}

function extractData(raw){
  // Normalise common OCR errors in numeric contexts
  const text = raw.replace(/\n/g,' ')
    .replace(/(?<=\d)O(?=[\d\-])/g,'0')
    .replace(/(?<=\d)[lI](?=[\d\-])/g,'1');

  // CODE: NNNN-NN-XX-NNNN  (tolerates spaces around dashes)
  let code='';
  const mCode=text.match(/(\d{3,4})\s*[-–]\s*(\d{2,3})\s*[-–]\s*([A-Za-z]{2,3})\s*[-–]\s*(\d{3,4})/);
  if(mCode) code=`${mCode[1]}-${mCode[2]}-${mCode[3].toUpperCase()}-${mCode[4]}`;

  // PALLET: word "Pallet" followed by number
  let pallet='';
  const mP=text.match(/[Pp]allet\s+(\d{5,8})/);
  if(mP) pallet=mP[1];

  // BULTOS: number before "BULTOS", or after "CON" and before "BULTOS"
  let bultos='';
  const mB1=text.match(/(?:CON|con)[:\s]+(\d{1,4})\s+(?:BULTOS|bultos)/i);
  const mB2=text.match(/(\d{1,4})\s+(?:BULTOS|bultos)/i);
  if(mB1) bultos=mB1[1];
  else if(mB2) bultos=mB2[1];

  return {code,pallet,bultos};
}

// CAMERA
btnCam.addEventListener('click',async()=>{
  if(stream){
    stream.getTracks().forEach(t=>t.stop()); stream=null;
    video.style.display='none'; camIdle.style.display='flex';
    finder.style.display='none'; scanLine.style.display='none';
    btnCam.textContent='Activar cámara'; btnCam.classList.remove('danger');
    btnScan.disabled=true; statusEl.style.display='none'; return;
  }
  try{
    setStatus('Solicitando acceso a la cámara…','scan');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    video.srcObject=stream; video.style.display='block'; camIdle.style.display='none';
    finder.style.display='block'; scanLine.style.display='block';
    btnCam.textContent='✕ Detener'; btnCam.classList.add('danger');
    btnScan.disabled=false; statusEl.style.display='none'; initWorker();
  }catch(e){
    let msg='No se pudo acceder a la cámara.';
    if(e.name==='NotAllowedError') msg='Permiso denegado. Habilitá la cámara en Ajustes del navegador.';
    if(e.name==='NotFoundError')   msg='No se encontró cámara en este dispositivo.';
    setStatus(msg,'err');
  }
});

function preprocess(src){
  const o=document.createElement('canvas'); o.width=src.width; o.height=src.height;
  const c=o.getContext('2d'); c.filter='contrast(1.7) brightness(1.1) grayscale(1)';
  c.drawImage(src,0,0); return o;
}

btnScan.addEventListener('click',async()=>{
  if(isScanning||!stream)return;
  isScanning=true; btnScan.disabled=true; setStatus('Capturando imagen…','scan');
  cvs.width=video.videoWidth||1280; cvs.height=video.videoHeight||960;
  ctx.drawImage(video,0,0);
  try{
    const{data:{text,confidence}}=await worker.recognize(preprocess(cvs));
    const clean=text.replace(/\n+/g,' ').trim();
    ocrRaw.textContent=clean||'(sin texto)';
    const{code,pallet,bultos}=extractData(clean);
    const conf=Math.round(confidence);
    function fill(el,inp,val){if(val){el.textContent=val;el.classList.remove('empty');inp.value=val;}else{el.textContent='–';el.classList.add('empty');inp.value='';}}
    fill(resCode,inpCode,code); fill(resPallet,inpPallet,pallet); fill(resBultos,inpBultos,bultos);
    const found=[code,pallet,bultos].filter(Boolean).length;
    if(found===3)     setStatus(`✓ Todo detectado (confianza ${conf}%). Revisá y guardá.`,'ok');
    else if(found>0)  setStatus(`Detección parcial: ${found}/3 campos (confianza ${conf}%). Completá a mano.`,'scan');
    else              setStatus('No se detectaron datos. Mejorá la iluminación o acercate más.','err');
    setProgress(0);
  }catch(e){setStatus('Error OCR: '+e.message,'err');setProgress(0);}
  isScanning=false; btnScan.disabled=false;
});

btnSave.addEventListener('click',()=>{
  const code=inpCode.value.trim(), pallet=inpPallet.value.trim(), bultos=inpBultos.value.trim();
  if(!code||!pallet){setStatus('Completá al menos Código y Pallet','err');return;}
  const now=new Date();
  const fecha=now.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  records.unshift({code,pallet,bultos,fecha});
  saveLocal(); renderTable();
  inpCode.value=''; inpPallet.value=''; inpBultos.value='';
  [resCode,resPallet,resBultos].forEach(el=>{el.textContent='–';el.classList.add('empty');});
  setStatus(`✓ Guardado. Total: ${records.length} registro${records.length!==1?'s':''}.`,'ok');
});

function saveLocal(){try{localStorage.setItem('etiquetas_v2',JSON.stringify(records.slice(0,1000)));}catch(e){}}

function renderTable(){
  count.textContent=`(${records.length})`;
  if(!records.length){tbody.innerHTML='<tr><td colspan="5" class="empty-msg">Sin registros aún</td></tr>';return;}
  tbody.innerHTML=records.map((r,i)=>`
    <tr class="${i===0?'new-row':''}">
      <td style="color:#aaa;font-size:10px">${records.length-i}</td>
      <td style="font-weight:700;color:var(--green-dark)">${r.code}</td>
      <td>${r.pallet}</td>
      <td>${r.bultos||'–'}</td>
      <td style="font-family:inherit;font-size:10px;color:var(--text2)">${r.fecha}</td>
    </tr>`).join('');
}

btnClear.addEventListener('click',()=>{
  if(!records.length)return;
  if(!confirm(`¿Eliminar los ${records.length} registros?`))return;
  records.length=0; saveLocal(); renderTable(); setStatus('Registros eliminados','err');
});

btnExport.addEventListener('click',()=>{
  if(!records.length){setStatus('No hay registros para exportar','err');return;}
  const rows=[['Código','Pallet','Bultos','Fecha y Hora'],...records.map(r=>[r.code,r.pallet,r.bultos||'',r.fecha])];
  const wb=XLSX.utils.book_new(), ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:20},{wch:12},{wch:8},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws,'Escaneos');
  const today=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
  XLSX.writeFile(wb,`etiquetas_${today}.xlsx`);
  setStatus(`✓ Excel descargado: etiquetas_${today}.xlsx`,'ok');
});

renderTable();
</script>
</body>
</html>
